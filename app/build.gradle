apply plugin: 'com.android.application'

// Release signing secrets live outside version control (see keystore.properties.example).
def releaseKeystoreFile = rootProject.file('keystore.properties')
def releaseKeystore = new Properties()
if (releaseKeystoreFile.exists()) {
    releaseKeystoreFile.withInputStream { releaseKeystore.load(it) }
}

android {
    ndkVersion "27.0.12077973"

    compileSdk = 36

    namespace 'com.limelight'

    defaultConfig {
        minSdk 21
        targetSdk 34

        versionName "1.0.0"
        versionCode = 100

        // EXPERIMENT: AV1 operating-rate 240 decoder hint for the Pixel 9a A/B. Compile-time
        // gated off by default. perfDebug enables it; optimized perf can opt in explicitly
        // with -Pav1OperatingRateExperiment=true, without enabling other perfDebug changes.
        buildConfigField "boolean", "AV1_OPERATING_RATE_240", "false"
        // A/B: subtract Display.getAppVsyncOffsetNanos() from the Balanced presentation
        // timestamp (Nova's release convention). Off in every build type except perfDebug.
        buildConfigField "boolean", "BALANCED_SUBTRACT_APP_VSYNC_OFFSET", "false"
        // Opt-in Pixel 9a/Google AV1 submission hints; no change to the default rendering hints.
        buildConfigField "boolean", "ADPF_TWO_THREAD_EXPERIMENT", "true"
        // Isolated 1 ms submission-budget experiment. Pixel 9a captures on 2026-10-01:
        // reported submission mean 0.99 -> 0.82-0.85 ms, but codec queue-to-completion
        // 4.24 -> 4.19-4.33 ms (no demonstrated decoding-latency improvement). Genuine
        // work accounting and thread membership are unchanged; target is not a proven optimum.
        buildConfigField "int", "ADPF_SUBMIT_TARGET_NS", "1000000"
        // Diagnostic builds may log; the optimized Perigee build strips all app logging.
        buildConfigField "boolean", "LOG_ENABLED", "true"
        // Off by default. The optimized perf A/B can opt in with -Pav1BlockInputExperiment=true.
        // Runtime scope also requires Pixel 9a/Google AV1, ADPF opt-in, async, Balanced, <=1080p,
        // and no GL upscaling. ADPF target/thread membership and decoder options stay unchanged.
        buildConfigField "boolean", "AV1_BLOCK_INPUT_EXPERIMENT", "false"

        // Generate native debug symbols to allow Google Play to symbolicate our native crashes
        ndk.debugSymbolLevel = 'FULL'
    }

    signingConfigs {
        release {
            if (releaseKeystoreFile.exists()) {
                storeFile rootProject.file(releaseKeystore['storeFile'])
                storePassword releaseKeystore['storePassword']
                keyAlias releaseKeystore['keyAlias']
                keyPassword releaseKeystore['keyPassword']
            }
        }
    }

    flavorDimensions.add("root")

    buildFeatures {
        buildConfig = true
    }

    productFlavors {
        root {
            // Android O has native mouse capture, so don't show the rooted
            // version to devices running O on the Play Store.
            maxSdk 25

            externalNativeBuild {
                ndkBuild {
                    arguments "PRODUCT_FLAVOR=root"
                }
            }

            resValue "string",
                    "obtainium_app_url",
                    "data:text/html;base64,PGgxPlJvb3QgYnVpbGQgaXMgbm90IGF2YWlsYWJsZTwvaDE+"

            applicationId "io.github.xtmartinez.perigee.root"
            dimension "root"
            buildConfigField "boolean", "ROOT_BUILD", "true"
        }

        nonRoot_game {
            externalNativeBuild {
                ndkBuild {
                    arguments "PRODUCT_FLAVOR=nonRoot"
                }
            }

            resValue "string",
                    "obtainium_app_url",
                    "https://apps.obtainium.imranr.dev/redirect?r=obtainium://app/%7B%22id%22%3A%22io.github.xtmartinez.perigee%22%2C%22url%22%3A%22https%3A%2F%2Fgithub.com%2FXT-Martinez%2Fperigee%22%2C%22author%22%3A%22XT-Martinez%22%2C%22name%22%3A%22Perigee%22%2C%22additionalSettings%22%3A%22%7B%5C%22apkFilterRegEx%5C%22%3A%5C%22nonRoot%5C%22%2C%5C%22matchGroupToUse%5C%22%3A%5C%22%241%5C%22%2C%5C%22versionExtractionRegEx%5C%22%3A%5C%22v(.%2B)%5C%22%7D%22%7D"

            applicationId "io.github.xtmartinez.perigee"
            dimension "root"
            buildConfigField "boolean", "ROOT_BUILD", "false"
        }
    }

    compileOptions {
        encoding "UTF-8"
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        disable 'MissingTranslation'
        lintConfig file('lint.xml')
    }

    bundle {
        language {
            // Avoid splitting by language, since we allow users
            // to manually switch language in settings.
            enableSplit = false
        }
        density {
            // FIXME: This should not be necessary but we get
            // weird crashes due to missing drawable resources
            // when this split is enabled.
            enableSplit = false
        }
    }

    packaging {
        resources {
            pickFirsts.add('META-INF/versions/9/OSGI-INF/MANIFEST.MF')
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            resValue "string", "app_label", "Perigee Debug"
            resValue "string", "app_label_root", "Perigee Debug (Root)"
            resValue "string", "app_label_game", "Perigee Debug (Game)"

            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            buildConfigField "boolean", "LOG_VERBOSE", "true"
        }
        release {
            // To whomever is releasing/using an APK in release mode with
            // Moonlight's official application ID, please stop. I see every
            // single one of your crashes in my Play Console and it makes
            // Moonlight's reliability look worse and makes it more difficult
            // to distinguish real crashes from your crashy VR app. Seriously,
            // 44 of the *same* native crash in 72 hours and a few each of
            // several other crashes.
            //
            // This is technically not your fault. I would have hoped Google
            // would validate the signature of the APK before attributing
            // the crash to it. I asked their Play Store support about this
            // and they said they don't and don't have plans to, so that sucks.
            //
            // In any case, it's bad form to release an APK using someone
            // else's application ID. There is no legitimate reason, that
            // anyone would need to comment out the following line, except me
            // when I release an official signed Moonlight build. If you feel
            // like doing so would solve something, I can tell you it will not.
            // You can't upgrade an app while retaining data without having the
            // same signature as the official version. Nor can you post it on
            // the Play Store, since that application ID is already taken.
            // Reputable APK hosting websites similarly validate the signature
            // is consistent with the Play Store and won't allow an APK that
            // isn't signed the same as the original.
            //
            // I wish any and all people using Moonlight as the basis of other
            // cool projects the best of luck with their efforts. All I ask
            // is to please change the applicationId before you publish.
            //
            // TL;DR: Leave the following line alone!
            applicationIdSuffix ".release"
            resValue "string", "app_label", "Perigee"
            resValue "string", "app_label_root", "Perigee (Root)"
            resValue "string", "app_label_game", "Perigee (Game)"

            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            shrinkResources true
        }
perf {
    initWith release
    matchingFallbacks = ["release"]
    debuggable false
    minifyEnabled true
    shrinkResources true
    // Published APKs are signed with the release key when keystore.properties is present;
    // local builds without it fall back to the debug key.
    signingConfig releaseKeystoreFile.exists() ? signingConfigs.release : signingConfigs.debug
    // The published build: no suffix, so it installs as the plain Perigee package.
    applicationIdSuffix ""
    resValue "string", "app_label", "Perigee"
    resValue "string", "app_label_root", "Perigee (Root)"
    resValue "string", "app_label_game", "Perigee (Game)"
    buildConfigField "boolean", "LOG_VERBOSE", "false"
    buildConfigField "boolean", "LOG_ENABLED", "false"
    proguardFile 'proguard-clean.pro'
    buildConfigField "boolean", "AV1_OPERATING_RATE_240",
            (project.findProperty("av1OperatingRateExperiment") == "true").toString()
    buildConfigField "boolean", "AV1_BLOCK_INPUT_EXPERIMENT",
            (project.findProperty("av1BlockInputExperiment") == "true").toString()

    // Make sure native is optimized (no debug NDK)
    externalNativeBuild {
        //-03 thinlto
        ndkBuild {
            // Enable perf path and *release* optimizations
            arguments "APP_PERF:=1", "APP_OPTIM:=release", "NDK_DEBUG=0", "APP_LOGGING=0"
            // per provare Full LTO:   add "APP_LTO_FULL=1"
            // per provare NO  LTO:    add "APP_LTO_NONE=1"
        }
    }
}
        // Separate debuggable companion to the optimized perf build. Its own package ID
        // preserves the installed perf app and its private data, while the inherited
        // native build arguments keep the same release-optimized decoder path.
        perfDebug {
            initWith perf
            matchingFallbacks = ["perf", "release"]
            applicationIdSuffix ".perfdebug"
            resValue "string", "app_label", "Perigee Debug"
            resValue "string", "app_label_root", "Perigee Debug (Root)"
            resValue "string", "app_label_game", "Perigee Debug (Game)"
            debuggable true
            minifyEnabled false
            shrinkResources false
            buildConfigField "boolean", "LOG_VERBOSE", "true"
            buildConfigField "boolean", "LOG_ENABLED", "true"
            // Keep logging in the debug companion only.
            proguardFiles = [getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro']
            externalNativeBuild {
                ndkBuild {
                    arguments "APP_LOGGING=1"
                }
            }
            // The debug companion enables the hint regardless of the perf opt-in property.
            buildConfigField "boolean", "AV1_OPERATING_RATE_240", "true"
            // A/B: subtract Display.getAppVsyncOffsetNanos() from the Balanced presentation
            // timestamp so Perigee matches Nova's release convention.
            buildConfigField "boolean", "BALANCED_SUBTRACT_APP_VSYNC_OFFSET", "true"
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }

    splits {
        abi {
            enable true
            reset()
            include "x86", "x86_64", "armeabi-v7a", "arm64-v8a"
        }
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    implementation 'org.bouncycastle:bcprov-jdk18on:1.81'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.81'
    implementation 'org.jcodec:jcodec:0.2.5'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jmdns:jmdns:3.6.2'
    implementation 'com.github.cgutman:ShieldControllerExtensions:1.0.1'
    implementation 'com.google.code.gson:gson:2.13.1'
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'com.github.ByteHamster:SearchPreference:v2.5.1'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation 'com.google.ai.edge.litert:litert:1.4.0'
    implementation 'com.google.ai.edge.litert:litert-gpu:1.4.0'
    implementation 'org.opencv:opencv:4.12.0'

    // Unit test dependencies
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.test:core:1.7.0'
    testImplementation 'org.robolectric:robolectric:4.16'
    testImplementation 'org.mockito:mockito-core:5.19.0'
}
